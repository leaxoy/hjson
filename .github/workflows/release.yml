name: Release

# Every push of a v* tag publishes installables for all platforms; a manual run
# only uploads artifacts, which is how a branch gets tested end to end.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # An untagged build still needs a name that cannot collide with a
            # published one, so pin it to the commit.
            base=$(scripts/version.sh)
            echo "version=${base}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is cross-built from one Apple Silicon runner: the SDK carries
          # both architectures, so no Intel machine is needed.
          - target: aarch64-apple-darwin
            os: macos
            runner: macos-15
          - target: x86_64-apple-darwin
            os: macos
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            os: linux
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: linux
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          # Neither this crate nor the gpui stack declares a feature gate, so
          # stable is the reproducible choice; the local toolchain happens to
          # be nightly, which makes this workflow the first stable build.
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        # gpui's native side is C: xcb for the window, xkbcommon plus
        # xkbcommon-x11 for input. The first CI run got as far as linking and
        # then reported "unable to find library -lxkbcommon-x11", which is what
        # these -dev packages provide; a missing one only shows up as a cc
        # failure, never as a configure error. Textures come from Metal /
        # Direct3D and TLS is rustls, so there is no openssl to install.
        # libwayland-dev is not on the link line — the wayland code is loaded
        # with dlopen — but a build script probes for it, so it stays.
        # librsvg rasterizes the launcher icon.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-xcb-dev libxcb1-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype-dev librsvg2-bin

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (macOS)
        if: matrix.os == 'macos'
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/package-macos.sh

      - name: Package (Linux)
        if: matrix.os == 'linux'
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/package-linux.sh

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: scripts/package-windows.ps1 -Target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: hjson-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # Windows on ARM lives in its own job instead of the matrix above, and builds
  # on GitHub's native arm64 runner: that image ships Visual Studio 2026 with
  # the ARM64 MSVC toolset already installed, so the toolset never has to be
  # added at runtime. Adding it on an x64 runner is what kept failing —
  # --wait is only honoured by the bootstrapper (vs_enterprise.exe /
  # vs_buildtools.exe), not by vs_installer.exe, so the call returned after a
  # few seconds having installed nothing, and the exit code it reported was
  # blank because the real work happens in a process it forks.
  windows-arm64:
    needs: version
    runs-on: windows-11-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-pc-windows-msvc

      # aarch64-pc-windows-msvc is this runner's host triple, so Rust comes with
      # it; the target add only matters if the image ever changes, and never
      # fails when it is already there.
      - name: Build
        shell: pwsh
        run: |
          rustup target add aarch64-pc-windows-msvc
          if ($LASTEXITCODE) { throw "rustup target add failed with $LASTEXITCODE" }
          cargo build --release --target aarch64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: scripts/package-windows.ps1 -Target aarch64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: hjson-aarch64-pc-windows-msvc
          path: dist/
          if-no-files-found: error

  release:
    # Tags only; a manual run stops at the artifacts so nothing gets published
    # by accident.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build, windows-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HJson ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
