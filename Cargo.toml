[package]
name = "hjson"
version = "0.1.2"
edition = "2024"

[dependencies]
futures = "0.3"
gpui-kit = { version = "0.9.0", features = ["tree-sitter"] }
# Direct only to switch on the inspector hooks the devtools panel reads; the
# crate itself is the same gpui-pre 0.3 gpui-kit already builds.
gpui = { package = "gpui-pre", version = "0.3", features = ["inspector"] }
# Inspector overlay (element picker, box model, styles). Initialized only in
# debug builds — see main.rs.
gpui-devtools = "0.5"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "0.3.11" }
serde_json = { version = "1", features = ["preserve_order"] }

# Settings persistence.
dirs = "7"
json-patch = "5"
rust-i18n = "4"
sys-locale = "0.3"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
# `fat` plus a single codegen unit is the smallest link rust will give up
# performance for: cross-crate inlining can then drop everything the app never
# reaches. The cost is build time, which only CI and a release run pay.
lto = "fat"
codegen-units = 1
# A linked Rust binary carries the whole symbol table, which is dead weight for
# a shipped app and costs a few megabytes. This covers every target; the macOS
# and Linux packaging scripts repeat the job with the system strip, because
# rustc reports a failure here only as a warning.
strip = "symbols"
# The unwind tables (frame + except + info) are several megabytes and only buy
# a stack trace on a panic that already means the process is going away.
panic = "abort"
